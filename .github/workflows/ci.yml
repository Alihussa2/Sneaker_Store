name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Installer .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit-tests
        run: dotnet test Unittest/Unittest.csproj --no-build --configuration Release

      - name: Integrationstests
        run: dotnet test integrationstest/integrationstest.csproj --no-build --configuration Release

      # E2E-testene (Sneaker_Store.E2ETests) kræver en kørende app + browser og køres
      # derfor kun lokalt indtil videre - de er ikke med i denne kommando.
