<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Min side - Sneaker Store</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-sm navbar-dark bg-dark mb-3">
            <div class="container">
                <a class="navbar-brand" href="/">👟 SneakerStore</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target=".navbar-collapse">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="navbar-collapse collapse d-sm-inline-flex justify-content-between">
                    <ul class="navbar-nav flex-grow-1">
                        <li class="nav-item"><a class="nav-link" href="/">Shop</a></li>
                        <li class="nav-item"><a class="nav-link" href="/privacy.html">Privacy</a></li>
                        <li class="nav-item" data-nav="min-side"><a class="nav-link" href="/min-side.html">Min side</a></li>
                        <li class="nav-item" data-nav="admin"><a class="nav-link" href="/admin.html">Admin</a></li>
                        <li class="nav-item" data-nav="logout"><a class="nav-link" href="#" id="logoutLink">Logout</a></li>
                        <li class="nav-item" data-nav="login"><a class="nav-link" href="/login.html">Login</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="container">
        <main role="main" class="pb-3">
            <h1>Min side</h1>
            <p id="brugerInfo"></p>

            <h3>Mine ordrer</h3>
            <table class="table">
                <thead>
                    <tr>
                        <th>Ordre-id</th>
                        <th>Sko</th>
                        <th>Antal</th>
                        <th>Total pris (DKK)</th>
                    </tr>
                </thead>
                <tbody id="ordreTabel">
                    <tr><td colspan="4">Henter ordrer...</td></tr>
                </tbody>
            </table>

            <a href="/">Tilbage til shop</a>
        </main>
    </div>

    <footer class="border-top footer text-muted">
        <div class="container">
            &copy; 2024 - Sneaker_Store - <a href="/privacy.html">Privacy</a>
        </div>
    </footer>

    <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/nav.js"></script>
    <script>
        async function hentOrdrer() {
            const tbody = document.getElementById('ordreTabel');
            const [ordreResponse, skoResponse] = await Promise.all([
                fetch('/api/ordre/mine'),
                fetch('/api/sko')
            ]);

            if (!ordreResponse.ok || !skoResponse.ok) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-danger">Kunne ikke hente ordrer.</td></tr>';
                return;
            }

            const ordrer = await ordreResponse.json();
            const sko = await skoResponse.json();

            if (ordrer.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">Du har ingen ordrer endnu.</td></tr>';
                return;
            }

            tbody.innerHTML = ordrer.map(ordre => {
                const tilhoerendeSko = sko.find(s => s.skoId === ordre.skoId);
                const skoNavn = tilhoerendeSko ? `${tilhoerendeSko.maerke} ${tilhoerendeSko.model}` : `Sko #${ordre.skoId}`;
                return `
                    <tr>
                        <td>${ordre.ordreId}</td>
                        <td>${skoNavn}</td>
                        <td>${ordre.antal}</td>
                        <td>${ordre.totalPris}</td>
                    </tr>
                `;
            }).join('');
        }

        (async () => {
            const bruger = await initNav();
            if (!bruger) {
                window.location.href = '/login.html';
                return;
            }
            document.getElementById('brugerInfo').textContent = `Logget ind som ${bruger.navn} (${bruger.email})`;
            hentOrdrer();
        })();
    </script>
</body>
</html>
